<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 전화</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --sub:#6b7280; --main:#2563eb; --call:#16a34a; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1c2128; --text:#f0f2f5; --sub:#9aa4b2; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font-family:-apple-system,"Noto Sans KR",sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; }
  button { font:inherit; border:0; border-radius:12px; padding:12px 16px; cursor:pointer; }
  #mic { width:100%; font-size:20px; padding:22px; background:var(--main); color:#fff; }
  #mic.on { background:var(--danger); }
  #heard { margin-top:10px; color:var(--sub); min-height:22px; }
  .row { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(128,128,128,.2); }
  .row:last-child { border-bottom:0; }
  .row .info { flex:1; min-width:0; }
  .name { font-weight:600; font-size:18px; }
  .num { color:var(--sub); font-size:14px; }
  a.call { background:var(--call); color:#fff; text-decoration:none; border-radius:12px; padding:12px 18px; font-weight:600; }
  .big a.call { display:block; text-align:center; font-size:22px; padding:18px; margin-top:8px; }
  .small { background:transparent; color:var(--danger); padding:8px; }
  .secondary { background:rgba(128,128,128,.15); color:var(--text); }
  input { font:inherit; width:100%; padding:12px; border-radius:10px; border:1px solid rgba(128,128,128,.4); background:var(--bg); color:var(--text); margin-bottom:8px; }
  .btns { display:flex; gap:8px; }
  .btns button { flex:1; }
  .hint { color:var(--sub); font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<h1>🎤 음성으로 전화 걸기</h1>

<div class="card">
  <button id="mic">🎤 눌러서 이름 말하기</button>
  <div id="heard"></div>
</div>

<div id="result"></div>

<div class="card">
  <strong>연락처 등록</strong>
  <div class="btns" style="margin:10px 0">
    <button id="pick" class="secondary">📇 전화번호부에서 선택</button>
  </div>
  <input id="n" placeholder="이름 (예: 홍길동)" autocomplete="off">
  <input id="p" placeholder="전화번호 (예: 010-1234-5678)" type="tel" autocomplete="off">
  <button id="add" class="secondary" style="width:100%">직접 추가</button>
  <div class="hint" id="pickHint"></div>
</div>

<div class="card">
  <strong>내 목록</strong>
  <div id="list"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'voicecall_contacts_v1';
let contacts = [];
try { contacts = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(contacts)); } catch(e) {} };

const norm = s => (s || '').replace(/[\s\-.,!?]/g, '').toLowerCase();
const telHref = p => 'tel:' + p.replace(/[^\d+]/g, '');

function lev(a, b) {
  const d = Array.from({length: a.length + 1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

function findMatches(heard) {
  const h = norm(heard);
  if (!h) return [];
  const scored = contacts.map(c => {
    const n = norm(c.name);
    let s = 99;
    if (n === h) s = 0;
    else if (n.includes(h) || h.includes(n)) s = 1;
    else { const d = lev(n, h); if (d <= Math.max(1, Math.floor(n.length / 3))) s = 1 + d; }
    return { c, s };
  }).filter(x => x.s < 99).sort((a, b) => a.s - b.s);
  return scored.slice(0, 3).map(x => x.c);
}

function esc(s) { return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function showResult(heard) {
  const m = findMatches(heard);
  const box = $('result');
  if (!m.length) {
    box.innerHTML = `<div class="card">"${esc(heard)}" 와 일치하는 연락처가 없어요.</div>`;
    return;
  }
  box.innerHTML = m.map((c, i) => `
    <div class="card ${i === 0 ? 'big' : ''}">
      <div class="name">${esc(c.name)}</div>
      <div class="num">${esc(c.tel)}</div>
      <a class="call" href="${telHref(c.tel)}">📞 ${i === 0 ? esc(c.name) + '에게 ' : ''}통화</a>
    </div>`).join('');
}

function renderList() {
  $('list').innerHTML = contacts.length ? contacts.map((c, i) => `
    <div class="row">
      <div class="info"><div class="name">${esc(c.name)}</div><div class="num">${esc(c.tel)}</div></div>
      <a class="call" href="${telHref(c.tel)}">통화</a>
      <button class="small" data-del="${i}">삭제</button>
    </div>`).join('') : '<div class="hint">아직 등록된 연락처가 없어요.</div>';
}
$('list').addEventListener('click', e => {
  const i = e.target.dataset.del;
  if (i !== undefined) { contacts.splice(+i, 1); save(); renderList(); }
});

function addContact(name, tel) {
  name = (name || '').trim(); tel = (tel || '').trim();
  if (!name || !tel) return;
  const ex = contacts.find(c => norm(c.name) === norm(name));
  if (ex) ex.tel = tel; else contacts.push({ name, tel });
  save(); renderList();
}

$('add').onclick = () => {
  addContact($('n').value, $('p').value);
  $('n').value = ''; $('p').value = '';
};

// 전화번호부 선택 (안드로이드 크롬)
const canPick = 'contacts' in navigator && 'ContactsManager' in window;
if (canPick) {
  $('pickHint').textContent = '전화번호부에서 자주 거는 사람들을 여러 명 선택해 두세요.';
  $('pick').onclick = async () => {
    try {
      const res = await navigator.contacts.select(['name', 'tel'], { multiple: true });
      res.forEach(r => { if (r.name && r.name[0] && r.tel && r.tel[0]) addContact(r.name[0], r.tel[0]); });
    } catch (e) { alert('연락처를 불러오지 못했어요: ' + e.message); }
  };
} else {
  $('pick').disabled = true;
  $('pickHint').textContent = '이 브라우저는 전화번호부 불러오기를 지원하지 않아요(아이폰 등). 이름과 번호를 직접 추가해 주세요.';
}

// 음성 인식
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (!SR) {
  $('mic').disabled = true;
  $('heard').textContent = '이 브라우저는 음성 인식을 지원하지 않아요. (안드로이드 크롬 / 아이폰 사파리 권장)';
} else {
  $('mic').onclick = () => {
    if (listening) { rec && rec.stop(); return; }
    rec = new SR();
    rec.lang = 'ko-KR';
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    rec.onstart = () => { listening = true; $('mic').classList.add('on'); $('mic').textContent = '🔴 듣는 중… (누르면 중지)'; $('heard').textContent = ''; };
    rec.onresult = e => {
      const r = e.results[e.results.length - 1];
      const text = r[0].transcript;
      $('heard').textContent = '들은 말: ' + text;
      if (r.isFinal) {
        // 대안 후보까지 포함해 가장 먼저 매칭되는 것 사용
        for (let k = 0; k < r.length; k++) {
          if (findMatches(r[k].transcript).length) { showResult(r[k].transcript); return; }
        }
        showResult(text);
      }
    };
    rec.onerror = e => { $('heard').textContent = '음성 인식 오류: ' + e.error + (e.error === 'not-allowed' ? ' (마이크 권한을 허용해 주세요)' : ''); };
    rec.onend = () => { listening = false; $('mic').classList.remove('on'); $('mic').textContent = '🎤 눌러서 이름 말하기'; };
    rec.start();
  };
}

renderList();
</script>
</body>
</html>
